version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: quicktick-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quicktick_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  quicktick:

    build: .

    container_name: quicktick-app

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: quicktick_db
      DB_USER: root
      DB_PASSWORD: root

volumes:

  mysql-data:
