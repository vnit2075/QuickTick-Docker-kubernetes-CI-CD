apiVersion: apps/v1
kind: Deployment

metadata:
  name: quicktick-deployment

spec:

  replicas: 2

  selector:
    matchLabels:
      app: quicktick

  template:

    metadata:
      labels:
        app: quicktick

    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z mysql-service 3306; do echo waiting for mysql-service; sleep 2; done;']
      containers:

      - name: quicktick

        image: vnit2075/quicktick:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        env:

        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: quicktick-config
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: quicktick-config
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: quicktick-config
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: quicktick-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quicktick-secret
              key: DB_PASSWORD
